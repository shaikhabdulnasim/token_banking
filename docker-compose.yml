version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: token_bank_redis
    ports:
      - "6379:6379"
    restart: always


  token_bank_app:
    build: .
    container_name: token_bank_service
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always
    environment:
      - GEMINI_API_KEY=your_api_key
